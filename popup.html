<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VietReader</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 10v4M6.3 6v12M10.1 3v18M13.9 7v10M17.7 5v14M21.5 10v4"/></svg></div><div><h1>VietReader</h1><p>Trợ lý đọc văn bản</p></div></header>
  <div class="intro">Chọn một cách để bắt đầu đọc trang hiện tại.</div>
  <button id="read-page" class="primary"><span>▤</span><span><b>Đọc nội dung chính</b><small>Tự tìm văn bản trên trang</small></span></button>
  <div class="hint"><b>Mẹo:</b> Bôi đen đoạn văn bản, nhấn chuột phải rồi chọn “Đọc văn bản đã chọn bằng VietReader”.</div>
  <div id="message" role="status"></div>
  <footer>Tiếng Việt sử dụng giọng đọc Google trực tuyến; các ngôn ngữ khác sử dụng giọng từ Web Speech API khả dụng trên thiết bị.</footer>
  <script src="popup.js"></script>
</body></html>
